[project]
name = "fasty"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic",
    "fastapi[standard]",
    "psycopg2",
    "pydantic",
    "pydantic-settings",
    "sqlmodel",
]

[dependency-groups]
dev = [
    "bandit",
    "faker",
    "httpx2",
    "mypy",
    "python-dotenv",
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-xdist",
    "requests",
    "ruff",
    "schemathesis",
    "ty",
]

[tool.pytest_env]
DB_ENGINE="sqlite"
DB_HOST="localhost"
DB_NAME="test_fasty"
DB_PASSWORD="password"
DB_USER="fasty"
DEBUG="True"

[tool.ruff.lint]
select = [
    # FastAPI
    "FAST",
    # Bandit
    "S",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
