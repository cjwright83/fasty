[project]
name = "fasty"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Chris Wright", email = "cjwright83y@gmail.com"},
]
dependencies = [
    "alembic[psycopg2]>=1.16.2",
    "databases[postgresql]>=0.9.0",
    "fastapi>=0.115.14",
    "gunicorn>=23.0.0",
    "psycopg2>=2.9.10",
    "pydantic[dotenv]>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-jose>=3.5.0",
    "uvicorn>=0.35.0",
]
requires-python = "==3.13.*"
readme = "README.md"
license = {text = "MIT"}

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "pytest-forked>=1.6.0",
    "pytest-xdist>=3.8.0",
    "requests>=2.32.4",
    "ruff>=0.12.2",
    "schemathesis>=4.0.4",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "S",  # flake8-bandit
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
"*_test.py" = ["S"]

[tool.pdm]
distribution = false
